# Build the Vagar SAC supplemental WDAC policy on a GitHub-hosted Windows
# runner (the laptop runs Windows 11 Home, which has no ConfigCI module).
#
# Manual trigger only (workflow_dispatch) — run it after this branch is
# pushed. It does NOT deploy anything and does NOT touch the laptop.
# Output: a .cip artifact (vagar-supplemental-policy) to download and
# deploy per vagar-sac-fix-plan-2026-11-13-v2.md sections 10-12.
#
# Safety invariants (from the plan, do not relax):
# - Smart App Control stays ON; base policy untouched; no existing .cip touched.
# - NEVER use the -Supplemental switch on Add-SignerRule (documented
#   boot-failure cause on a supplemental policy).
# - NEVER hand-author policy XML; everything is generated by ConfigCI.
# - The policy supplements base 0283ac0f-fff1-49ae-ada1-8a933130cad6
#   (VerifiedAndReputableDesktop, the enforced SAC base on the laptop).
# - Staging holds ONLY Vagar-signed files; the Add-SignerRule step trusts
#   the Vagar certificate, so every Vagar-signed file is allowed whether
#   or not it was staged.

name: Build Vagar SAC Supplemental Policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-policy:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify ConfigCI cmdlets and parameters
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mod = Get-Module -ListAvailable ConfigCI
          if (-not $mod) { throw 'ConfigCI module is not available on this runner' }
          Import-Module ConfigCI
          $need = @{
            'New-CIPolicy'       = @('MultiplePolicyFormat', 'ScanPath', 'NoScript', 'Fallback', 'FilePath', 'Level', 'UserPEs')
            'Add-SignerRule'     = @('FilePath', 'CertificatePath', 'User')
            'Set-RuleOption'     = @('FilePath', 'Option', 'Delete')
            'Set-CIPolicyIdInfo' = @('FilePath', 'PolicyId', 'SupplementsBasePolicyID', 'PolicyName')
            'Set-CIPolicyVersion' = @('FilePath', 'Version')
            'Test-CIPolicy'      = @('XmlFile')
            'ConvertFrom-CIPolicy' = @('XmlFilePath', 'BinaryFilePath')
          }
          foreach ($cmd in $need.Keys) {
            $c = Get-Command $cmd -ErrorAction Stop
            foreach ($p in $need[$cmd]) {
              if (-not $c.Parameters.ContainsKey($p)) { throw "$cmd is missing required parameter -$p" }
            }
            Write-Host "$cmd OK"
          }
          # There is NO -BasePolicyId parameter on Set-CIPolicyIdInfo (v1 of
          # the plan used it and would have failed). Fail loudly if the
          # expected parameter ever disappears.
          if (-not (Get-Command Set-CIPolicyIdInfo).Parameters.ContainsKey('SupplementsBasePolicyID')) {
            throw 'Set-CIPolicyIdInfo has no -SupplementsBasePolicyID parameter'
          }
          Write-Host 'All ConfigCI cmdlets verified.'

      - name: Verify staged files are Vagar-signed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cer = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2('wdac/certs/vagar-signing.cer')
          Write-Host "Vagar cert: $($cer.Subject) thumbprint $($cer.Thumbprint) expires $($cer.NotAfter)"
          $files = Get-ChildItem wdac/staging -Recurse -File | Where-Object { $_.Extension -in '.pyd', '.dll' }
          Write-Host "Staged .pyd/.dll files: $($files.Count)"
          if ($files.Count -eq 0) { throw 'No staged files found under wdac/staging' }
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne $cer.Thumbprint) {
              $bad += "$($f.FullName) Status=$($sig.Status)"
            }
          }
          if ($bad.Count -gt 0) { throw "Non-Vagar-signed files in staging: $($bad -join '; ')" }
          Write-Host 'All staged files are Vagar-signed.'

      - name: Build supplemental policy XML
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = 'wdac/VagarSupplemental.xml'
          New-CIPolicy -MultiplePolicyFormat -Level Publisher -FilePath $xml -UserPEs -ScanPath wdac/staging -NoScript -Fallback Hash
          if (-not (Test-Path $xml)) { throw "Policy XML was not created at $xml" }
          Write-Host "New-CIPolicy done: $xml"
          $fb = Get-ChildItem wdac -Filter '*fallback*' -Recurse -ErrorAction SilentlyContinue
          foreach ($r in $fb) {
            Write-Host "Fallback report: $($r.FullName)"
            Get-Content $r.FullName | Write-Host
          }

      - name: Add Vagar signer rule (no -Supplemental switch)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-SignerRule -FilePath wdac/VagarSupplemental.xml -CertificatePath wdac/certs/vagar-signing.cer -User
          Write-Host 'Add-SignerRule done (certificate rule added; -Supplemental NOT used).'

      - name: Strip base-only rule options
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Valid supplemental options per Microsoft's policy-rules table:
          # 5 Inherit Default Policy, 6 Unsigned System Integrity Policy,
          # 7 Debug Policy Augmented, 13 Managed Installer,
          # 14 Intelligent Security Graph, 18 Runtime FilePath Rule Protection.
          # Everything else (notably Audit Mode, UMCI, Script Enforcement,
          # Advanced Boot Options Menu) is base-only and must be deleted:
          # a surviving Audit Mode would make the allow rules audit-only.
          # NOTE: there is NO Get-RuleOption cmdlet in ConfigCI (run
          # 44450822083 failed on it). Read the options from the policy
          # XML instead, and delete by integer option number: every
          # number outside the allowlist is delete-attempted, so only
          # allowlisted options can survive, whatever their names are.
          $allowed = @(5, 6, 7, 13, 14, 18)
          $xmlPath = 'wdac/VagarSupplemental.xml'
          function Get-XmlOptions {
            [xml]$x = Get-Content $xmlPath
            return @($x.SelectNodes("//*[local-name()='Option']") | ForEach-Object { $_.InnerText })
          }
          Write-Host 'Rule options present before strip:'
          foreach ($s in Get-XmlOptions) { Write-Host "  $s" }
          foreach ($n in 0..19) {
            if ($allowed -contains $n) { continue }
            try {
              Set-RuleOption -FilePath $xmlPath -Option $n -Delete -ErrorAction Stop
              Write-Host "Deleted base-only option $n (if it was present)"
            } catch {
              Write-Host "Option $n not present or not deletable; continuing"
            }
          }
          Write-Host 'Rule options remaining:'
          $remaining = Get-XmlOptions
          foreach ($s in $remaining) { Write-Host "  $s" }
          foreach ($bad in @('Audit Mode', 'UMCI', 'Script Enforcement', 'Advanced Boot Options Menu')) {
            if ($remaining -match [regex]::Escape($bad)) { throw "Base-only rule option '$bad' survived the strip" }
          }
          Write-Host 'Strip complete: only allowlisted rule options remain.'

      - name: Validate policy XML
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xmlPath = 'wdac/VagarSupplemental.xml'
          [xml]$x = Get-Content $xmlPath
          $signerCount = ($x.SelectNodes("//*[local-name()='Signer']")).Count
          $hashRules = $x.SelectNodes("//*[local-name()='Allow'][@Hash]")
          Write-Host "Signer rules: $signerCount; hash-based FileRules: $($hashRules.Count)"
          if ($hashRules.Count -gt 0) {
            Write-Host 'WARNING: hash rules present. A file covered only by a hash rule breaks if it is re-signed; signer rules are preferred for Vagar files.'
            foreach ($h in $hashRules) { Write-Host "  hash rule: $($h.GetAttribute('FriendlyName')) $($h.GetAttribute('Hash'))" }
          }
          Test-CIPolicy -XmlFile $xmlPath
          Write-Host 'Test-CIPolicy passed.'

      - name: Set policy ID (supplements SAC base) and version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $guid = [guid]::NewGuid().ToString()
          "POLICY_GUID=$guid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-CIPolicyIdInfo -FilePath wdac/VagarSupplemental.xml -PolicyId "{$guid}" -SupplementsBasePolicyID '0283ac0f-fff1-49ae-ada1-8a933130cad6' -PolicyName 'Vagar Supplemental'
          Set-CIPolicyVersion -FilePath wdac/VagarSupplemental.xml -Version '10.0.0.0'
          [xml]$x = Get-Content wdac/VagarSupplemental.xml
          $policyType = $x.DocumentElement.GetAttribute('PolicyType')
          Write-Host "PolicyType after Set-CIPolicyIdInfo: $policyType"
          if ($policyType -ne 'Supplemental Policy') { throw "PolicyType is '$policyType', expected 'Supplemental Policy'" }
          Write-Host "PolicyId: $guid (supplements base 0283ac0f-fff1-49ae-ada1-8a933130cad6)"

      - name: Convert to .cip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $guid = $env:POLICY_GUID
          $cip = "wdac/$guid.cip"
          ConvertFrom-CIPolicy -XmlFilePath wdac/VagarSupplemental.xml -BinaryFilePath $cip
          if (-not (Test-Path $cip)) { throw ".cip was not created at $cip" }
          $h = (Get-FileHash -Path $cip -Algorithm SHA256).Hash
          $size = (Get-Item $cip).Length
          Write-Host ".cip created: $cip SHA256=$h size=$size bytes"
          "CIP_PATH=$cip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CIP_SHA256=$h" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: vagar-supplemental-policy
          path: |
            ${{ env.CIP_PATH }}
            wdac/VagarSupplemental.xml
          if-no-files-found: error
